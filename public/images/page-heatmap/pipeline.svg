<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 430" role="img" aria-labelledby="title desc">
  <title id="title">页面热力图的数据链路</title>
  <desc id="desc">页面端记录点击、深度和时长，数据侧按口径去重聚合，分析端在预览页面中定位并展示热图。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10" fill="none" stroke="#64748b" stroke-width="1.6"/></marker>
  </defs>
  <rect width="720" height="430" rx="20" fill="#f8fafc"/>
  <g font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif">
    <text x="32" y="46" font-size="25" font-weight="650" fill="#0f172a">从页面行为到热力图</text>
    <text x="32" y="78" font-size="17" fill="#64748b">采集定义行为，聚合定义口径，预览还原位置</text>
    <g fill="#fff" stroke="#cbd5e1" stroke-width="1.5">
      <rect x="32" y="112" width="190" height="222" rx="12"/>
      <rect x="265" y="112" width="190" height="222" rx="12"/>
      <rect x="498" y="112" width="190" height="222" rx="12"/>
    </g>
    <g fill="#0369a1" font-size="23" font-weight="650" text-anchor="middle">
      <text x="127" y="151">页面端</text>
      <text x="360" y="151">数据侧</text>
      <text x="593" y="151">分析端</text>
    </g>
    <g fill="#334155" font-size="21" text-anchor="middle">
      <text x="127" y="201">元素与点击位置</text>
      <text x="127" y="244">最深浏览位置</text>
      <text x="127" y="287">区块可见时长</text>
      <text x="360" y="201">筛选与去重</text>
      <text x="360" y="244">深度累计分布</text>
      <text x="360" y="287">区块时长聚合</text>
      <text x="593" y="201">预览页面定位</text>
      <text x="593" y="244">颜色映射</text>
      <text x="593" y="287">数值与样本量</text>
    </g>
    <g stroke="#64748b" stroke-width="2" marker-end="url(#arrow)">
      <path d="M229 222H254"/>
      <path d="M462 222H487"/>
    </g>
    <text x="360" y="383" text-anchor="middle" font-size="19" fill="#475569">同一张页面，三种行为数据，三种统计含义</text>
  </g>
</svg>
