<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 390" role="img" aria-labelledby="title desc">
  <title id="title">相对点击位置的尺寸换算</title>
  <desc id="desc">采集元素宽160高100，点击偏移40和60；展示元素宽240高150，还原偏移60和90。横向比例均为百分之二十五，纵向比例均为百分之六十。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10" fill="none" stroke="#64748b" stroke-width="1.6"/></marker>
  </defs>
  <rect width="720" height="390" rx="20" fill="#f8fafc"/>
  <g font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif">
    <text x="32" y="46" font-size="25" font-weight="650" fill="#0f172a">记住元素内的位置比例</text>
    <g font-size="22" fill="#334155" text-anchor="middle">
      <text x="132" y="112">采集：160 × 100</text>
      <text x="560" y="100">展示：240 × 150</text>
    </g>
    <g fill="#e0f2fe" stroke="#0284c7" stroke-width="2">
      <rect x="52" y="152" width="160" height="100" rx="6"/>
      <rect x="440" y="127" width="240" height="150" rx="6"/>
    </g>
    <g fill="none" stroke="#0284c7" stroke-width="1.5" stroke-dasharray="5 4">
      <path d="M92 152V212H52"/>
      <path d="M500 127V217H440"/>
    </g>
    <g fill="#e11d48" stroke="#fff" stroke-width="2">
      <circle cx="92" cy="212" r="7"/>
      <circle cx="500" cy="217" r="7"/>
    </g>
    <path d="M242 202H408" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="325" y="179" text-anchor="middle" font-size="20" fill="#475569">位置比例不变</text>
    <g font-size="21" fill="#334155" text-anchor="middle">
      <text x="132" y="306">偏移 (40, 60)</text>
      <text x="560" y="316">偏移 (60, 90)</text>
    </g>
    <text x="360" y="362" text-anchor="middle" font-size="22" fill="#0369a1">nx = 25%　　ny = 60%</text>
  </g>
</svg>
